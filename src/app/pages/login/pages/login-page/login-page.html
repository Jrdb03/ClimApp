<div class="min-h-screen flex items-center justify-center bg-stone-100 px-4">
  
  <form
    class="w-full max-w-md"
    autocomplete="off"
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
        Iniciar sesión
      </h2>
      
      <!-- Email -->
      <div class="mb-5">
        <label class="block text-sm text-gray-600 mb-1">Email</label>
        <input
          type="email"
          placeholder="tu@email.com"
          formControlName="email"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 
                 text-gray-800 placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />

        @if(formUtils.isValidField(loginForm, 'email')){
          <span class="text-sm text-red-500 mt-1 block">
            {{formUtils.getFieldError(loginForm, "email")}}
          </span>
        }
      </div>

      <!-- Contraseña -->
      <div class="mb-5">
        <label class="block text-sm text-gray-600 mb-1">Contraseña</label>
        <input
          type="password"
          placeholder="Contraseña"
          formControlName="password"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 bg-gray-50 
                 text-gray-800 placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
        />

        @if(formUtils.isValidField(loginForm, 'password')){
          <span class="text-sm text-red-500 mt-1 block">
            {{formUtils.getFieldError(loginForm, "password")}}
          </span>
        }
      </div>

      @if (loginError) {
        <div class="mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-2">
          Email o contraseña incorrectos
        </div>
      }

      <!-- Botón -->
      <button
        type="submit"
        class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 
               text-white font-medium shadow-sm hover:shadow-md 
               transition active:scale-[0.99]"
      >
        Login
      </button>

      <!-- Extra -->
      <p class="text-sm text-gray-500 text-center mt-4">
        ¿Olvidaste tu contraseña?
      </p>

    </div>
  </form>

</div>
